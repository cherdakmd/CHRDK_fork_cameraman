name: Build plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper-api-version:
          - 1.21.11-R0.1-SNAPSHOT
          - 26.3.build.218-stable
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile against Paper API ${{ matrix.paper-api-version }}
        run: mvn --batch-mode --no-transfer-progress clean package -Dpaper-api.version=${{ matrix.paper-api-version }}
