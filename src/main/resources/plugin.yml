name: Кинематографичная камера
version: '${project.version}'
main: xyz.shibomb.cameraman.CameramanPlugin
api-version: '1.21.11'
commands:
  cameraman:
    aliases: [камера]
    description: Управление кинематографичной камерой
    usage: '/<command> <подкоманда> [аргументы]'
    permission: cameraman.use
permissions:
  cameraman.use:
    description: Разрешает использование команд камеры
    default: op
