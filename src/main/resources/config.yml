# Конфигурация плагина «Кинематографичная камера»

# Внутренние данные независимых операторов; изменяются командами плагина.
cameraOperators: []
operatorSettings: {}

# Язык игровых сообщений: ru или en. Изменения применяются после перезапуска.
language: ru

# UUID текущего оператора камеры.
# Значение обновляется автоматически при использовании /cameraman set.
cameraman: ""

# Включён ли режим новичков.
newcomerMode: true

# Включён ли режим ротации.
rotationMode: true

# Интервал ротации в секундах.
rotationInterval: 60
# Минимальное расстояние от камеры до следующей цели. Более близкие цели пропускаются.
minRotationDistance: 5.0

# Включён ли режим выбора мобов.
mobTargetMode: false

# Фильтры целей: пустой список миров означает «любой мир».
targetFilters:
  allowedWorlds: []
  excludedPlayers: []
  excludedPermissions: []
  minDistance: 0.0
  maxDistance: 0.0 # 0 отключает верхнее ограничение

# Включён ли автоматический выбор мобов.
autoMobTarget: true

# Задержка в секундах перед выбором моба, если игроков нет.
autoMobTargetDelay: 60

# Автоматический пейзажный режим (включается, если режим наблюдателя отключён).
# Если spectateMode отключён, после телепортации к цели запускается пейзажная съёмка.
autoScenic: true
autoScenicPerspective: RANDOM

# Настройки телепортации
# При включении камера плавно перемещается к новой цели вместо мгновенной телепортации.
teleportSmooth: false

# Длительность плавной телепортации в секундах.
teleportSmoothDuration: 3
# Скорость плавной телепортации (блоков в секунду), используется для расчёта длительности на больших расстояниях.
# Длительность = расстояние / скорость. Если результат меньше teleportSmoothDuration, применяется заданная длительность.
teleportSmoothSpeed: 50.0

# Сглаживание камеры для всех движущихся ракурсов (0.01–1.0).
# Чем ниже значение, тем мягче и медленнее камера догоняет целевую позицию.
cameraSmoothing: 0.35

# Включён ли режим наблюдения за игроками.
spectateMode: true

# Ракурс наблюдения за игроками (POV, BEHIND, FRONT, RANDOM).
spectatePerspective: RANDOM

# Включён ли режим наблюдения за мобами.
mobSpectateMode: true

# Ракурс наблюдения за мобами (POV, BEHIND, FRONT, RANDOM).
# Ракурс наблюдения за мобами (POV, BEHIND, FRONT, RANDOM).
mobSpectatePerspective: RANDOM

# Включено ли ночное зрение при наблюдении за мобами.
mobNightVision: true

# Расстояние для ракурсов BEHIND/FRONT: число (например, "3.0") или диапазон (например, "3.0-6.0").
spectateDistance: "3.0-5.0"

# Высота для ракурсов BEHIND/FRONT: число (например, "1.0") или диапазон (например, "1.0-3.0").
spectateHeight: "0.0-1.0"

# Скорость вращения вокруг цели в ракурсе ORBIT (градусов за тик).
# Число (например, 1.0) или диапазон (например, 0.5-1.5).
orbitSpeed: "0.1"

# Направление вращения ORBIT (LEFT, RIGHT, RANDOM).
orbitDirection: "RANDOM"

# Плавность DYNAMIC (0.01–1.0). Чем меньше значение, тем плавнее и медленнее движение.
dynamicSmoothness: "0.05"

# Длительность цикла ракурса FLYBY (секунды).
flybyDuration: "30.0"

# Длительность цикла ракурса CRANE (секунды).
craneDuration: "30.0"

# Диапазон высоты ракурса CRANE.
craneHeightMin: "1.0"
craneHeightMax: "5.0"

# Настройки ракурса MOVE (линейное движение).
# Формат: "значение" или "минимум-максимум"
moveX: "-1-1"
moveY: "0-0.1"
moveZ: "-0.1-0.1"
moveSpeed: "0.01"

# Список ракурсов для случайного выбора при наблюдении за игроками.
randomPlayerPerspectives:
  - POV
  - BEHIND
  - FRONT
  - ORBIT
  - FLYBY
  - MOVE
  - DYNAMIC_BEHIND
  - DYNAMIC_FRONT
  - DYNAMIC_POV

# Список ракурсов для случайного выбора в пейзажном режиме.
randomScenicPerspectives:
  - ORBIT
  - FLYBY
  - MOVE
  - CRANE
  - FIX

# Список ракурсов для случайного выбора при наблюдении за мобами.
randomMobPerspectives:
  - POV
  - BEHIND
  - FRONT
  - ORBIT
  - FLYBY
  - CRANE
  - DYNAMIC_BEHIND
  - DYNAMIC_FRONT
  - DYNAMIC_POV
